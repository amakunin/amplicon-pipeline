# Native nf-core/ampliseq 3.0.0 parameters.
# The driver will generate input/outdir; do not set them here.
primer_fwd: "RKTCAACMAATCATAAAGATATTGG"
primer_rev: "TAAACTTCWGGRTGWCCAAAAAATCA"
sequencing_type: "nanopore"
asv_calling: "savont"
sample_inference: "pooled"
savont_options: "--min-read-length 600 --max-read-length 900"
decontam: "none"

# Built-in database; alternatively use sintax_ref_tax_custom and sintax_assign_taxlevels.
sintax_ref_taxonomy: "coidb"

# skipping steps for this configuration
skip_dada_taxonomy: true
skip_barrnap: true
skip_phyloseq: true
skip_tse: true
skip_qiime: true
skip_fastqc: True
skip_parquet_summary: True
# Preserve prototype behaviour; downstream summaries must report exclusions.
ignore_empty_input_files: true
ignore_failed_filtering: true
ignore_failed_trimming: true
