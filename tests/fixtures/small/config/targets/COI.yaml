# Input: nanopore reads; the driver supplies input and outdir.
sequencing_type: "nanopore"

# Primers: forward and reverse amplicon sequences.
primer_fwd: "RKTCAACMAATCATAAAGATATTGG"
primer_rev: "TAAACTTCWGGRTGWCCAAAAAATCA"

# ASV: pooled Savont inference and read-length limits.
asv_calling: "savont"
sample_inference: "pooled"
savont_options: "--min-read-length 600 --max-read-length 900"
decontam: "none"

# SINTAX: built-in taxonomy database and confidence cutoff.
sintax_ref_taxonomy: "coidb"
sintax_cutoff: 0.8

# Skips: disable unused analysis and reporting steps.
skip_dada_taxonomy: true
skip_barrnap: true
skip_phyloseq: true
skip_tse: true
skip_qiime: true
skip_fastqc: true
skip_parquet_summary: true

# Ignores: continue past empty inputs and failed filtering/trimming.
ignore_empty_input_files: true
ignore_failed_filtering: true
ignore_failed_trimming: true
